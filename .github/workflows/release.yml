name: Publish release

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - website/changelog.json
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      released: ${{ steps.compute.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --version

      - name: Compute version and decide if release is needed
        id: compute
        run: |
          LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)"
          if [[ -z "$LATEST_TAG" ]]; then
            VERSION='v0.1.0'
          else
            VERSION="$("$RUNNER_TEMP/git-cliff/bin/git-cliff" --config cliff.toml --bumped-version | tail -n 1 | tr -d '[:space:]')"
          fi
          echo "Latest tag: ${LATEST_TAG:-none}"
          echo "Calculated version: $VERSION"
          if [[ -z "$VERSION" || "$VERSION" == "$LATEST_TAG" ]]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate CHANGELOG.md for the new version
        if: steps.compute.outputs.released == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.compute.outputs.version }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Generate website changelog context for the new version
        if: steps.compute.outputs.released == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.compute.outputs.version }} --context
        env:
          OUTPUT: website/changelog.json

      - name: Commit, tag, and push
        if: steps.compute.outputs.released == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md website/changelog.json
          git commit -m "chore(release): ${{ steps.compute.outputs.version }}"
          git tag -a "${{ steps.compute.outputs.version }}" -m "Release ${{ steps.compute.outputs.version }}"
          git push origin HEAD:main
          git push origin "${{ steps.compute.outputs.version }}"

  release:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.bump.outputs.version }}

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip all

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.bump.outputs.version }}" \
            --title "${{ needs.bump.outputs.version }}" \
            --notes "${{ steps.git-cliff.outputs.content }}"

  sync-dev:
    needs: bump
    if: needs.bump.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fast-forward dev to main
        run: git push origin HEAD:dev
