<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tinker-tui</title>
  <meta name="description" content="TUI para escribir consultas de Laravel Tinker, ejecutarlas y ver el resultado como tabla." />
  <meta name="theme-color" content="#070707" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <section class="panel focus" id="history-panel" aria-label="Historial">
      <h2>Historial</h2>
      <ul id="history" role="listbox" aria-label="Consultas"></ul>
    </section>

    <section class="panel" id="editor-panel" aria-label="Editor">
      <h2 id="editor-title">Código PHP · <span data-version>v0.1.0</span></h2>
      <div id="editor" class="editor"></div>
    </section>

    <section class="panel" id="output-panel" aria-label="Resultado">
      <h2 id="output-title">Resultado</h2>
      <div id="output" class="output" tabindex="-1"></div>
    </section>
  </div>

  <footer>
    <p id="keys"></p>
    <p id="meta"><span data-version>v0.1.0</span> · <span id="footer-updated">Última actualización: …</span></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
